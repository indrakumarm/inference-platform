[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-platform"
version = "0.1.0"
description = "Inspect and prepare GPU hosts for inference serving."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
inference-platform = "inference_platform.cli:main"

[tool.setuptools.packages.find]
include = ["inference_platform*"]
